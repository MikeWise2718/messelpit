# Page numbers are BOOK pages (PDF page - 1).
#
# Schematic geological layer model of the Messel deposit, for the dtlite viewer.
#
# SCHEMATIC. Every elevation below is from Nix (2003), Geol. Abh. Hessen 112 (book pages
# cited); the SHAPES between those numbers are a parametric bowl, not interpolated
# boreholes. The 982-hole database that would make this faithful is in the unpublished
# Nix (2001) report (docs/messel-nix-2003-notes.md §3). Anything marked ASSUMPTION is a
# placement choice, not a published value — change it here, rerun tools/export_web.py.
#
# Frame: local scene metres (SW origin, UTM 32N 480000/5526000), elevations m NN.

[deposit]
# Outline = an ellipse fitted to today's pit at the 155 m contour (DGM1, 5 m, measured
# 2026-09-29: centre 2661/3597, semi-axes 439/360 m, major axis 62° from east). By 1957
# the W/E/S pit rims already matched today's extent, and mining there stopped in the
# "Randbereichen des Vorkommens" (p. 45), so the pit outline stands in for the deposit
# outline. ASSUMPTION: an ellipse.
centre = [2661.0, 3597.0]
semi_axes_m = [440.0, 360.0]
bearing_deg = 62.0            # major axis, counter-clockwise from east
top_m_nn = 170.0              # rim level: scarps at the pit rim at ~160-170 m NN (p. 46)
# Maar walls: listric faults against the Palaeozoic frame, steep in S/SE/W, stepped in
# N (p. 37). ASSUMPTION: one mean wall angle, so the fill narrows with depth.
wall_angle_deg = 60.0

[structure]
# Beds are near-horizontal in the centre and dip 20-25° toward the rims (p. 37).
# Bed surface: z(rho) = z_centre + A * rho^2, rho = normalised ellipse radius, with A
# chosen so the slope at the rim is tan(dip_at_rim).
dip_at_rim_deg = 22.5
# The structural low / FB 2001 site. Nix: FB 2001 "im Zentrum der Grube" (p. 30), in
# the structural low "im Südosten des Vorkommens" (p. 37), but Nix gives no coordinates.
# FB 2001's position is from Krister Smith's borehole database (messel-dt, data/v0/
# README.md, 2026-10): GK3 R 3482757.75 / H 5531296.42, collar 105.9 m NN -> UTM 32N ->
# local (2689.6, 3523.4); DGM1 there today is 105.7 m. (Until 2026-10-07 this was an
# ASSUMED lowest point of today's pit floor, 80 m away.) ASSUMPTION that remains: the
# bowl's lowest point sits exactly at FB 2001.
low = [2689.6, 3523.4]

# Section fills (for the viewer's section cut): what lies between today's ground and the
# topmost surface below it, and the frame the maar is cut into. A surface ABOVE the
# ground (the pre-mining lid) is drawn as a pale "removed" band instead.
[fills]
ground_unit = { unit = "Middle Messel-Fm: laminated oil shale (Schwarzpelit)", color = "#3d3a35" }
frame = { unit = "Palaeozoic frame: Rotliegend, granodiorite, diorite, amphibolite (not modelled)", color = "#8c8680" }
section_bottom_m_nn = -340.0   # a little below FB 2001's end depth (433 m -> ~-329 m NN)

# Surfaces: the TOP of each unit, coloured as that unit. z_centre = at the structural low.
# max_thickness_m: where the next surface down is absent, the unit ends this far below
# its top and the frame follows (the maar walls cut units off; schematic).
[[surface]]
id = "pre_mining_ground"
title = "Ground before mining, c. 1885 (schematic)"
unit = "Pre-mining ground surface"
color = "#e3d3a4"
kind = "flat"
z = 168.0
# starts switched off in the viewer: a flat sheet over the pit is hard to read (a grey
# ceiling from inside the pit) -- the section cut still shows the mined-away band
default_hidden = true
note = "Oil shale was ~160 m thick before mining over a base at ~6 m NN (p. 35) -> top ~166 m NN, plus 1-3 m Quaternary (p. 36); the Upper Messel-Fm (30-35 m) survived only in three marginal troughs (p. 36). The volume between this lid and today's ground is what was mined, 1885-1971."

[[surface]]
id = "top_lower_fm"
title = "Base of the oil shale / top of the Lower Messel-Fm"
unit = "Lower Messel-Formation (breccias, turbidites, tuffitic)"
color = "#9a7650"
kind = "bowl"
z_centre = 11.9           # FB 2001: oil-shale base at 94 m depth below a 105.9 m collar (Smith v0)
max_thickness_m = 134.0    # FB 2001: 94-228 m depth (Smith v0)
note = "Base of the oil shale at 11.9 m NN in FB 2001 (94 m depth; Krister Smith's borehole database, messel-dt v0). Nix (2003) gives ~6 m NN in the structural low and ~99 m of oil shale remaining (p. 35)."

[[surface]]
id = "top_tuffite"
title = "Base of the Messel-Formation (lake fill)"
unit = "Tuffitic sediments (transition below the lake fill)"
color = "#b3a77c"
kind = "bowl"
z_centre = -122.1         # FB 2001: lake-fill base at 228 m depth (Smith v0)
max_thickness_m = 12.0     # FB 2001: 228-240 m depth (Smith v0 / Nix p. 30)
note = "Base of the Messel-Formation at -122.1 m NN in FB 2001 (228 m depth; Smith v0). Nix (2003) gives ~-129 m NN (p. 37) and 229 m of lacustrine fill (p. 30)."

[[surface]]
id = "top_lapilli_tuff"
title = "Top of the lapilli tuff (diatreme)"
unit = "Lapilli tuff (phreatomagmatic eruption products)"
color = "#7f9168"
kind = "pipe"
z_centre = -134.1          # 240 m depth in FB 2001 (p. 30) below the 105.9 m collar
pipe_fraction = 0.40       # ASSUMPTION: diatreme radius as a fraction of the deposit
max_thickness_m = 133.0    # 240-373 m depth (p. 30)
note = "Lapilli tuff between 240 and 373 m depth in FB 2001 (p. 30). The diatreme lies under the structural low (p. 37); its width here is schematic."

[[surface]]
id = "top_diatreme_breccia"
title = "Top of the diatreme breccia"
unit = "Diatreme breccia (Rotliegend / granodiorite / amphibolite clasts)"
color = "#6f5d78"
kind = "pipe"
z_centre = -267.1          # 373 m depth in FB 2001 (Smith v0: top of the diatreme)
pipe_fraction = 0.30
note = "Layered mega-breccia below 373 m depth in FB 2001, drilled to 433 m (p. 30)."

# FB 2001 column: depths below ground. The unit boundaries at 94, 228 and 373 m are from
# Krister Smith's database (messel-dt v0); the finer splits at 208 and 240 m and the end
# depth from Nix's log summary (p. 30). Ground elevation is read from the DGM1 at
# `structure.low` (105.7 m; the collar was 105.9 m).
[column]
id = "fb2001"
title = "Research borehole FB Messel 2001"
radius_m = 6.0
note = "Drilled 2001 by FIS / GGA / HLUG in the pit centre, 433 m deep (Nix 2003, p. 30). Position and main boundaries from Krister Smith's borehole database (messel-dt v0); finer splits from Nix."
segments = [
  { from_m = 0,   to_m = 94,  unit = "Middle Messel-Fm: laminated oil shale (Schwarzpelit)", color = "#3d3a35" },
  { from_m = 94,  to_m = 208, unit = "Lower Messel-Fm: breccious sediments (Rotliegend, granodiorite, amphibolite clasts)", color = "#9a7650" },
  { from_m = 208, to_m = 228, unit = "Lower Messel-Fm: fine layered sands, silts, breccias", color = "#b08a5e" },
  { from_m = 228, to_m = 240, unit = "Tuffitic sediment", color = "#b3a77c" },
  { from_m = 240, to_m = 373, unit = "Lapilli tuff", color = "#7f9168" },
  { from_m = 373, to_m = 433, unit = "Diatreme breccia", color = "#6f5d78" },
]
